<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vortex - Criar Conta</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    :root {
      --bg-main: #0b0e14;
      --bg-surface: #121620;
      --bg-input: #181d2a;
      --accent-pink: #ff0055;
      --accent-pink-hover: #d90048;
      --border-subtle: #2d3748;
      --text-main: #e1e1e6;
      --text-muted: #94a3b8;
    }
    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .navbar {
      background-color: #121620 !important;
      border-bottom: 2px solid #ff0055;
    }
    .brand-logo {
      font-weight: 900;
      letter-spacing: 1px;
      color: #ff0055 !important;
    }
    .btn-action {
      background-color: #ff0055;
      color: #fff;
      border: none;
      font-weight: 600;
      transition: all 0.3s ease;
    }
    .btn-action:hover {
      background-color: #d90048;
      color: #fff;
      transform: translateY(-2px);
    }
    .auth-card {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    .input-group-text-custom {
      background-color: var(--bg-input);
      border: 1px solid var(--border-subtle);
      border-right: none;
      color: var(--text-muted);
    }
    .form-control-custom {
      background-color: var(--bg-input);
      border: 1px solid var(--border-subtle);
      color: #fff;
    }
    .form-control-custom::placeholder { color: #64748b; }
    .form-control-custom:focus {
      background-color: var(--bg-input);
      color: #fff;
      border-color: var(--accent-pink);
      box-shadow: 0 0 0 0.2rem rgba(255, 0, 85, 0.2);
    }
    .input-group:focus-within .input-group-text-custom {
      border-color: var(--accent-pink);
      color: var(--accent-pink);
    }
    .form-check-input:checked {
      background-color: var(--accent-pink);
      border-color: var(--accent-pink);
    }
    .link-accent {
      color: var(--accent-pink);
      text-decoration: none;
    }
    .link-accent:hover {
      color: var(--accent-pink-hover);
      text-decoration: underline;
    }
    footer {
      background-color: var(--bg-surface);
      border-top: 1px solid var(--border-subtle);
    }
  </style>
</head>
<body>

  <!-- HEADER / NAVBAR -->
  <header class="sticky-top">
    <nav class="navbar navbar-expand-lg navbar-dark py-3">
      <div class="container">
        <a href="index.html" class="navbar-brand d-flex align-items-center py-0">
          <img src="imagens/logo.png" alt="Vortex" style="height: 67px; width: auto; object-fit: contain;">
          <span class="brand-logo fs-4"><i>VORTEX</i></span>
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse mt-3 mt-lg-0" id="navbarContent">
          <div id="navUserActions" class="d-flex align-items-center gap-2 mt-2 mt-lg-0 ms-auto">
            <a href="index.html" class="btn btn-outline-light btn-sm text-nowrap">
              <i class="bi bi-house-door"></i> Início
            </a>
            <a href="register.html" class="btn btn-outline-light active btn-sm text-nowrap">
              <i class="bi bi-person-plus"></i> Cadastro
            </a>
            <a href="acesso.html" class="btn btn-outline-light btn-sm text-nowrap">
              <i class="bi bi-person-lock"></i> Acesso Restrito
            </a>
            <a href="login.html" class="btn btn-outline-light btn-sm text-nowrap">
              <i class="bi bi-box-arrow-in-right"></i> Login
            </a>
            <a href="cart.html" class="btn btn-action btn-sm text-nowrap position-relative">
              <i class="bi bi-cart3"></i> Carrinho
              <span id="cart-badge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-warning text-dark">0</span>
            </a>
          </div>
        </div>
      </div>
    </nav>
  </header>

  <!-- CONTEÚDO PRINCIPAL -->
  <main class="container my-5 flex-grow-1 d-flex align-items-center justify-content-center">
    <div class="row w-100 justify-content-center">
      <div class="col-12 col-md-10 col-lg-7">
        <div class="card auth-card p-3 p-sm-4">
          <div class="card-body">
            <h3 class="fw-bold text-white text-center mb-1">Crie sua conta</h3>
            <p class="text-secondary text-center small mb-4">Preencha os campos abaixo para começar suas compras.</p>

            <form id="registerForm" action="#" method="POST">
              <div class="row g-3">
                <!-- Nome Completo -->
                <div class="col-12 col-md-6">
                  <label for="fullName" class="form-label text-secondary small fw-semibold">Nome Completo</label>
                  <div class="input-group">
                    <span class="input-group-text input-group-text-custom"><i class="bi bi-person"></i></span>
                    <input type="text" class="form-control form-control-custom" id="fullName" placeholder="Seu nome" required>
                  </div>
                </div>

                <!-- CPF -->
                <div class="col-12 col-md-6">
                  <label for="cpf" class="form-label text-secondary small fw-semibold">CPF</label>
                  <div class="input-group">
                    <span class="input-group-text input-group-text-custom"><i class="bi bi-card-text"></i></span>
                    <input type="text" class="form-control form-control-custom" id="cpf" pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" minlength="14" maxlength="14" placeholder="000.000.000-00" required>
                  </div>
                </div>

                <!-- E-mail -->
                <div class="col-12">
                  <label for="email" class="form-label text-secondary small fw-semibold">E-mail</label>
                  <div class="input-group">
                    <span class="input-group-text input-group-text-custom"><i class="bi bi-envelope"></i></span>
                    <input type="email" class="form-control form-control-custom" id="email" placeholder="seu@email.com" required>
                  </div>
                </div>

                <!-- Senha -->
                <div class="col-12 col-md-6">
                  <label for="password" class="form-label text-secondary small fw-semibold">Senha</label>
                  <div class="input-group">
                    <span class="input-group-text input-group-text-custom"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control form-control-custom" id="password" minlength="8" placeholder="Mínimo 8 caracteres" required>
                  </div>
                </div>

                <!-- Confirmar Senha -->
                <div class="col-12 col-md-6">
                  <label for="confirmPassword" class="form-label text-secondary small fw-semibold">Confirmar Senha</label>
                  <div class="input-group">
                    <span class="input-group-text input-group-text-custom"><i class="bi bi-shield-lock"></i></span>
                    <input type="password" class="form-control form-control-custom" id="confirmPassword" minlength="8" placeholder="Repita a senha" required>
                  </div>
                </div>

                <!-- Termos e Condições -->
                <div class="col-12 mt-3">
                  <div class="form-check">
                    <input class="form-check-input bg-dark border-secondary" type="checkbox" id="terms" required>
                    <label class="form-check-label text-secondary small" for="terms">
                      Eu li e aceito os <a href="#" class="link-accent">Termos de Uso</a> e a <a href="#" class="link-accent">Política de Privacidade</a>.
                    </label>
                  </div>
                </div>

                <!-- Botão Criar Conta -->
                <div class="col-12 mt-4">
                  <button type="submit" class="btn btn-action w-100 py-2">
                    <i class="bi bi-person-plus me-2"></i> Criar Conta
                  </button>
                </div>
              </div>
            </form>

            <hr class="border-secondary my-4">

            <p class="text-center text-secondary small mb-0">
              Já tem uma conta? <a href="login.html" class="link-accent fw-semibold">Faça login</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="py-4 mt-auto">
    <div class="container text-center">
      <p class="text-secondary small mb-0">
        © 2026 Vortex. Todos os direitos reservados. Termos de Direitos Autorais.
      </p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const registerForm = document.getElementById('registerForm');
    const fullName = document.getElementById('fullName');
    const cpf = document.getElementById('cpf');
    const email = document.getElementById('email');
    const password = document.getElementById('password');
    const confirmPassword = document.getElementById('confirmPassword');

    registerForm.addEventListener('submit', function(event) {
      event.preventDefault();
      
      if (password.value !== confirmPassword.value) {
        alert('As senhas não são iguais. Por favor, tente novamente.');
        return;
      } 
      localStorage.setItem('fullName', fullName.value);
      localStorage.setItem('cpf', cpf.value);
      localStorage.setItem('email', email.value);
      localStorage.setItem('password', password.value);
      
      alert('Conta criada com sucesso, ' + fullName.value + '!');
      window.location.href = 'login.html';
    });

    cpf.addEventListener('input', function(event) {
      let valor = event.target.value.replace(/\D/g, '');
      valor = valor.replace(/(\d{3})(\d)/, '$1.$2');
      valor = valor.replace(/(\d{3})(\d)/, '$1.$2');
      valor = valor.replace(/(\d{3})(\d{1,2})$/, '$1-$2');
      event.target.value = valor;
    });
  </script>
</body>
</html>
