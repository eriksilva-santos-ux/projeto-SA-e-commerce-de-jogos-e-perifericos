<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GameStore - Criar Conta</title>
  <!-- Bootstrap 5.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body {
      background-color: #0b0e14;
      color: #e1e1e6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .navbar {
      background-color: #121620 !important;
      border-bottom: 2px solid #ff0055;
    }
    .brand-logo {
      font-weight: 900;
      letter-spacing: 1px;
      color: #ff0055 !important;
    }
    .btn-action {
      background-color: #ff0055;
      color: #fff;
      border: none;
      font-weight: 600;
      transition: all 0.3s ease;
    }
    .btn-action:hover {
      background-color: #d90048;
      color: #fff;
      transform: translateY(-2px);
    }
    .auth-card {
      background-color: #121620;
      border: 1px solid #2d3748;
      border-radius: 12px;
    }
    footer {
      background-color: #121620;
      border-top: 1px solid #2d3748;
    }
  </style>
</head>
<body>

  <!-- HEADER / NAVBAR -->
  <header class="sticky-top">
    <nav class="navbar navbar-expand-lg navbar-dark py-3">
      <div class="container">
        <!-- Logo -->
        <a class="navbar-brand brand-logo fs-3 d-flex align-items-center gap-2" href="index.html">
          <i class="bi bi-controller"></i> GAMESTORE
        </a>

        <!-- Botão Toggle Mobile -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse mt-3 mt-lg-0" id="navbarContent">
          <!-- Barra de Pesquisa -->
          <form class="d-flex mx-auto col-12 col-lg-6 my-2 my-lg-0" role="search">
            <div class="input-group">
              <input class="form-control bg-dark text-white border-secondary" type="search" placeholder="Busque jogos, consoles, periféricos..." aria-label="Pesquisa">
              <button class="btn btn-action" type="submit">
                <i class="bi bi-search"></i>
              </button>
            </div>
          </form>

          <!-- Ações de Usuário -->
          <div class="d-flex align-items-center justify-content-lg-end gap-3 ms-auto">
            <a href="register.html" class="btn btn-outline-light btn-sm text-nowrap active">
              <i class="bi bi-person-plus"></i> Cadastro
            </a>
            <a href="login.html" class="btn btn-outline-light btn-sm text-nowrap">
              <i class="bi bi-box-arrow-in-right"></i> Login
            </a>
            <a href="cart.html" class="btn btn-action btn-sm text-nowrap position-relative">
              <i class="bi bi-cart3"></i> Carrinho
              <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-warning text-dark">
                0
              </span>
            </a>
          </div>
        </div>
      </div>
    </nav>
  </header>

  <!-- CONTEÚDO PRINCIPAL - FORMULÁRIO DE CADASTRO -->
  <main class="container my-5 flex-grow-1 d-flex align-items-center justify-content-center">
    <div class="row w-100 justify-content-center">
      <div class="col-12 col-md-10 col-lg-7">
        <div class="card auth-card shadow p-4">
          <div class="card-body">
            <h3 class="fw-bold text-white text-center mb-1">Crie sua conta</h3>
            <p class="text-secondary text-center small mb-4">Preencha os campos abaixo para começar suas compras.</p>

            <form action="#" method="POST">
              <div class="row g-3">
                <!-- Nome Completo -->
                <div class="col-12 col-md-6">
                  <label for="fullName" class="form-label text-secondary small fw-semibold">Nome Completo</label>
                  <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary text-secondary"><i class="bi bi-person"></i></span>
                    <input type="text" class="form-control bg-dark text-white border-secondary" id="fullName" placeholder="Seu nome" required>
                  </div>
                </div>

                <!-- CPF -->
                <div class="col-12 col-md-6">
                  <label for="cpf" class="form-label text-secondary small fw-semibold">CPF</label>
                  <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary text-secondary"><i class="bi bi-card-text"></i></span>
                    <input type="text" class="form-control bg-dark text-white border-secondary" id="cpf" placeholder="000.000.000-00" required>
                  </div>
                </div>

                <!-- E-mail -->
                <div class="col-12">
                  <label for="email" class="form-label text-secondary small fw-semibold">E-mail</label>
                  <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary text-secondary"><i class="bi bi-envelope"></i></span>
                    <input type="email" class="form-control bg-dark text-white border-secondary" id="email" placeholder="seu@email.com" required>
                  </div>
                </div>

                <!-- Senha -->
                <div class="col-12 col-md-6">
                  <label for="password" class="form-label text-secondary small fw-semibold">Senha</label>
                  <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary text-secondary"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control bg-dark text-white border-secondary" id="password" placeholder="Mínimo 8 caracteres" required>
                  </div>
                </div>

                <!-- Confirmar Senha -->
                <div class="col-12 col-md-6">
                  <label for="confirmPassword" class="form-label text-secondary small fw-semibold">Confirmar Senha</label>
                  <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary text-secondary"><i class="bi bi-shield-lock"></i></span>
                    <input type="password" class="form-control bg-dark text-white border-secondary" id="confirmPassword" placeholder="Repita a senha" required>
                  </div>
                </div>

                <!-- Termos e Condições -->
                <div class="col-12 mt-3">
                  <div class="form-check">
                    <input class="form-check-input bg-dark border-secondary" type="checkbox" id="terms" required>
                    <label class="form-check-label text-secondary small" for="terms">
                      Eu li e aceito os <a href="#" class="text-danger text-decoration-none">Termos de Uso</a> e a <a href="#" class="text-danger text-decoration-none">Política de Privacidade</a>.
                    </label>
                  </div>
                </div>

                <!-- Botão Criar Conta -->
                <div class="col-12 mt-4">
                  <button type="submit" class="btn btn-action w-100 py-2">
                    <i class="bi bi-person-plus me-2"></i> Criar Conta
                  </button>
                </div>
              </div>
            </form>

            <hr class="border-secondary my-4">

            <!-- Link de navegação para login -->
            <p class="text-center text-secondary small mb-0">
              Já tem uma conta? <a href="login.html" class="text-danger fw-semibold text-decoration-none">Faça login</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- FOOTER / RODAPÉ -->
  <footer class="py-4 mt-auto">
    <div class="container">
      <div class="row align-items-center gy-3">
        <div class="col-md-12 text-center">
          <p class="text-secondary small mb-0">
            © 2026 GameStore. Todos os direitos reservados. Termos de Direitos Autorais.
          </p>
        </div>
      </div>
    </div>
  </footer>

  <!-- Bootstrap 5.3 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
