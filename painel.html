<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vortex - Entrar na Conta</title>
  <!-- Bootstrap 5.3-->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icos -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body {
      background-color: #0b0e14;
      color: #e1e1e6;
    }
    .navbar {
      background-color: #121620 !important;
      border-bottom: 2px solid #ff0055;
    }
    .brand-logo {
      font-weight: 900;
      letter-spacing: 1px;
      color: #ff0055 !important;
    }
    .hero-banner {
      background: linear-gradient(135deg, #1f2533 0%, #0b0e14 100%);
      border: 1px solid #2d3748;
      border-radius: 12px;
      min-height: 280px;
    }
    .btn-action {
      background-color: #ff0055;
      color: #fff;
      border: none;
      font-weight: 600;
      transition: all 0.3s ease;
    }
    .btn-action:hover {
      background-color: #d90048;
      color: #fff;
      transform: translateY(-2px);
    }
    .card-custom {
      background-color: #121620;
      border: 1px solid #2d3748;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }
    .card-custom:hover {
      border-color: #ff0055;
      transform: translateY(-4px);
    }
    footer {
      background-color: #121620;
      border-top: 1px solid #2d3748;
    }
  </style>
</head>
<body>

  <!-- HEADER / NAVBAR -->
 <header class="sticky-top">

    <div class="container">
      <!-- Logo Centralizada -->

      </a>

              <i class="bi bi-house"></i> início

    </div>
  </nav>
</header>

<main class="container my-4 flex-grow-1">

  <!-- SEÇÃO BANNER -->
  <section class="mb-5">
    <div id="mainCarousel" class="hero-banner p-4 p-md-5 shadow rounded-3 d-flex flex-column align-items-center justify-content-center text-center">
      <i class="bi bi-file-plus display-3 text-danger mb-3"></i>
      <h1 class="display-5 fw-bold text-white mb-4">CADASTRAR PRODUTOS</h1>
