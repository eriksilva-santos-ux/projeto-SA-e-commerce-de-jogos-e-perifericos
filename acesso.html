<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vortex - Acesso Administrativo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    :root {
      --bg-main: #0b0e14;
      --bg-surface: #121620;
      --bg-input: #181d2a;
      --accent-pink: #ff0055;
      --accent-pink-hover: #d90048;
      --border-subtle: #2d3748;
      --text-main: #e1e1e6;
      --text-muted: #94a3b8;
    }
    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .navbar {
      background-color: #121620 !important;
      border-bottom: 2px solid #ff0055;
    }
    .brand-logo {
      font-weight: 900;
      letter-spacing: 1px;
      color: #ff0055 !important;
    }
    .btn-action {
      background-color: #ff0055;
      color: #fff;
      border: none;
      font-weight: 600;
      transition: all 0.3s ease;
    }
    .btn-action:hover {
      background-color: #d90048;
      color: #fff;
      transform: translateY(-2px);
    }
    .btn-action:disabled {
      background-color: #64748b;
      transform: none;
    }
    .auth-card {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    .input-group-text-custom {
      background-color: var(--bg-input);
      border: 1px solid var(--border-subtle);
      border-right: none;
      color: var(--text-muted);
    }
    .form-control-custom {
      background-color: var(--bg-input);
      border: 1px solid var(--border-subtle);
      color: #fff;
    }
    .form-control-custom::placeholder { color: #64748b; }
    .form-control-custom:focus {
      background-color: var(--bg-input);
      color: #fff;
      border-color: var(--accent-pink);
      box-shadow: 0 0 0 0.2rem rgba(255, 0, 85, 0.2);
    }
    .input-group:focus-within .input-group-text-custom {
      border-color: var(--accent-pink);
      color: var(--accent-pink);
    }
    .btn-toggle-pass {
      background-color: var(--bg-input);
      border: 1px solid var(--border-subtle);
      border-left: none;
      color: var(--text-muted);
    }
    .btn-toggle-pass:hover {
      color: #fff;
      background-color: var(--bg-input);
      border-color: var(--border-subtle);
    }
    footer {
      background-color: var(--bg-surface);
      border-top: 1px solid var(--border-subtle);
    }
  </style>
</head>
<body>

  <!-- HEADER / NAVBAR -->
  <header class="sticky-top">
    <nav class="navbar navbar-expand-lg navbar-dark py-3">
      <div class="container">
        <a href="index.html" class="navbar-brand d-flex align-items-center py-0">
          <img src="imagens/logo.png" alt="Vortex" style="height: 67px; width: auto; object-fit: contain;" onerror="this.style.display='none'">
          <span class="brand-logo fs-4"><i>VORTEX</i></span>
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse mt-3 mt-lg-0" id="navbarContent">
          <div id="navUserActions" class="d-flex align-items-center gap-2 mt-2 mt-lg-0 ms-auto">
            <a href="index.html" class="btn btn-outline-light btn-sm text-nowrap">
              <i class="bi bi-house-door"></i> Início
            </a>
            <a href="register.html" class="btn btn-outline-light btn-sm text-nowrap">
              <i class="bi bi-person-plus"></i> Cadastro
            </a>
            <a href="acesso.html" class="btn btn-outline-light active btn-sm text-nowrap">
              <i class="bi bi-person-lock"></i> Acesso Restrito
            </a>
            <a href="login.html" class="btn btn-outline-light btn-sm text-nowrap">
              <i class="bi bi-box-arrow-in-right"></i> Login
            </a>
            <a href="cart.html" class="btn btn-action btn-sm text-nowrap position-relative">
              <i class="bi bi-cart3"></i> Carrinho
              <span id="cart-badge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-warning text-dark">0</span>
            </a>
          </div>
        </div>
      </div>
    </nav>
  </header>

  <!-- CONTEÚDO PRINCIPAL -->
  <main class="container my-5 flex-grow-1 d-flex align-items-center justify-content-center">
    <div class="row w-100 justify-content-center">
      <div class="col-12 col-md-8 col-lg-5">
        <div class="card auth-card p-3 p-sm-4">
          <div class="card-body">
            <div class="text-center mb-3">
              <span class="badge bg-danger bg-opacity-10 text-danger border border-danger border-opacity-25 px-3 py-2 rounded-pill mb-2">
                <i class="bi bi-shield-lock me-1"></i> Área Administrativa
              </span>
              <h3 class="fw-bold text-white mb-1">Acesse sua conta de ADM</h3>
              <p class="text-secondary small mb-0">Gerencie pedidos, produtos e usuários do sistema.</p>
            </div>

            <!-- ALERTA DE FEEDBACK -->
            <div id="feedbackAlert" class="alert d-none mt-3 mb-0 py-2 small" role="alert"></div>

            <form id="adminLoginForm" class="mt-4" novalidate>
              <!-- ID -->
              <div class="mb-3">
                <label for="adminId" class="form-label text-secondary small fw-semibold">ID de Administrador</label>
                <div class="input-group">
                  <span class="input-group-text input-group-text-custom"><i class="bi bi-fingerprint"></i></span>
                  <input type="text" class="form-control form-control-custom" id="adminId" placeholder="Ex: 12345" autocomplete="off" required>
                </div>
              </div>

              <!-- Senha -->
              <div class="mb-4">
                <label for="adminPassword" class="form-label text-secondary small fw-semibold">Senha</label>
                <div class="input-group">
                  <span class="input-group-text input-group-text-custom"><i class="bi bi-lock"></i></span>
                  <input type="password" class="form-control form-control-custom" id="adminPassword" placeholder="••••••••" required>
                  <button class="btn btn-toggle-pass" type="button" id="togglePasswordBtn" title="Mostrar/Ocultar senha">
                    <i class="bi bi-eye" id="togglePasswordIcon"></i>
                  </button>
                </div>
              </div>

              <!-- Botão Entrar -->
              <button type="submit" id="submitBtn" class="btn btn-action w-100 py-2">
                <i class="bi bi-box-arrow-in-right me-2"></i> Entrar no Painel
              </button>
            </form>

            <!-- DICA DE TESTE -->
            <div class="mt-4 pt-3 border-top border-secondary border-opacity-25 text-center">
              <small class="text-secondary">
                Acesso de teste: ID <code class="text-light">12345</code> | Senha <code class="text-light">admin123</code>
              </small>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="py-4 mt-auto">
    <div class="container text-center">
      <p class="text-secondary small mb-0">
        © 2026 Vortex. Todos os direitos reservados. Termos de Direitos Autorais.
      </p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const adminsAutorizados = [
      { id: '12345', senha: 'admin123', nome: 'Administrador Master', cargo: 'Gerente Geral' },
      { id: '99999', senha: 'vortex2026', nome: 'Suporte Vortex', cargo: 'Operador' }
    ];

    const adminLoginForm = document.getElementById('adminLoginForm');
    const adminIdInput = document.getElementById('adminId');
    const adminPasswordInput = document.getElementById('adminPassword');
    const feedbackAlert = document.getElementById('feedbackAlert');
    const submitBtn = document.getElementById('submitBtn');
    const togglePasswordBtn = document.getElementById('togglePasswordBtn');
    const togglePasswordIcon = document.getElementById('togglePasswordIcon');

    let tentativas = 0;
    const maxTentativas = 3;

    // Se já estiver logado, mostra atalho direto para o painel
    const sessaoAtiva = JSON.parse(sessionStorage.getItem('adminLogado'));
    if (sessaoAtiva) {
      mostrarAlerta(`Sessão ativa como ${sessaoAtiva.nome}. <a href="cadastro-produto.html" class="alert-link">Ir para o painel</a>`, 'info');
    }

    function atualizarBadgeCarrinho() {
      const cartBadge = document.getElementById('cart-badge');
      const carrinho = JSON.parse(localStorage.getItem('vortex_cart')) || [];
      const totalItens = carrinho.reduce((acc, item) => acc + (item.qty || 1), 0);
      if (cartBadge) cartBadge.textContent = totalItens;
    }
    atualizarBadgeCarrinho();

    togglePasswordBtn.addEventListener('click', function () {
      const isPassword = adminPasswordInput.type === 'password';
      adminPasswordInput.type = isPassword ? 'text' : 'password';
      togglePasswordIcon.classList.toggle('bi-eye', !isPassword);
      togglePasswordIcon.classList.toggle('bi-eye-slash', isPassword);
    });

    function mostrarAlerta(mensagem, tipo) {
      feedbackAlert.className = `alert alert-${tipo} mt-3 mb-0 py-2 small d-flex align-items-center gap-2`;
      const icone = tipo === 'success' ? 'bi-check-circle-fill' : 'bi-exclamation-triangle-fill';
      feedbackAlert.innerHTML = `<i class="bi ${icone}"></i><span>${mensagem}</span>`;
    }

    adminLoginForm.addEventListener('submit', function (event) {
      event.preventDefault();

      const idDigitado = adminIdInput.value.trim();
      const senhaDigitada = adminPasswordInput.value;

      if (!idDigitado || !senhaDigitada) {
        mostrarAlerta('Preencha o ID de Administrador e a senha.', 'warning');
        return;
      }

      const adminEncontrado = adminsAutorizados.find(
        (adm) => adm.id === idDigitado && adm.senha === senhaDigitada
      );

      if (adminEncontrado) {
        sessionStorage.setItem('adminLogado', JSON.stringify({
          id: adminEncontrado.id,
          nome: adminEncontrado.nome,
          cargo: adminEncontrado.cargo,
          loginEm: new Date().toISOString()
        }));

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Acessando...';
        mostrarAlerta(`Bem-vindo(a), ${adminEncontrado.nome}! Redirecionando...`, 'success');

        setTimeout(() => {
          window.location.href = 'cadastro-produto.html';
        }, 800);
      } else {
        tentativas++;
        const restantes = maxTentativas - tentativas;

        if (restantes <= 0) {
          submitBtn.disabled = true;
          adminIdInput.disabled = true;
          adminPasswordInput.disabled = true;
          mostrarAlerta('Acesso bloqueado temporariamente por excesso de tentativas inválidas.', 'danger');
        } else {
          mostrarAlerta(`ID ou senha inválidos. Você tem mais ${restantes} tentativa(s).`, 'danger');
          adminPasswordInput.value = '';
          adminPasswordInput.focus();
        }
      }
    });
  </script>
</body>
</html>
