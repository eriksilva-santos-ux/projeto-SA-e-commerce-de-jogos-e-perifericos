<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GameStore - E-commerce de Jogos e Acessórios</title>
  <!-- Bootstrap 5.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons  -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body {
      background-color: #0b0e14;
      color: #e1e1e6;
    }
    .navbar {
      background-color: #121620 !important;
      border-bottom: 2px solid #ff0055;
    }
    .brand-logo {
      font-weight: 900;
      letter-spacing: 1px;
      color: #ff0055 !important;
    }
    .hero-banner {
      background: linear-gradient(135deg, #1f2533 0%, #0b0e14 100%);
      border: 1px solid #2d3748;
      border-radius: 12px;
      min-height: 280px;
    }
    .btn-action {
      background-color: #ff0055;
      color: #fff;
      border: none;
      font-weight: 600;
      transition: all 0.3s ease;
    }
    .btn-action:hover {
      background-color: #d90048;
      color: #fff;
      transform: translateY(-2px);
    }
    .card-custom {
      background-color: #121620;
      border: 1px solid #2d3748;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }
    .card-custom:hover {
      border-color: #ff0055;
      transform: translateY(-4px);
    }
    footer {
      background-color: #121620;
      border-top: 1px solid #2d3748;
    }
  </style>
</head>
<body>

  <!-- HEADER / NAVBAR (Logo, Busca, Cadastro, Login, Carrinho) -->
  <header class="sticky-top">
    <nav class="navbar navbar-expand-lg navbar-dark py-3">
      <div class="container">
        <!-- Logo -->
        <a class="navbar-brand brand-logo fs-3 d-flex align-items-center gap-2">
          <i class="bi bi-controller"></i> GAMESTORE
        </a>

        <!-- Botão Toggle Mobile -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse mt-3 mt-lg-0" id="navbarContent">
          <!-- Barra de Pesquisa -->
          <form class="d-flex mx-auto col-12 col-lg-6 my-2 my-lg-0" role="search">
            <div class="input-group">
              <input class="form-control bg-dark text-white border-secondary" type="search" placeholder="Busque jogos, consoles, periféricos..." aria-label="Pesquisa">
              <button class="btn btn-action" type="submit">
                <i class="bi bi-search"></i>
              </button>
            </div>
          </form>

          <!-- Ações de Usuário (Cadastro, Login, Carrinho) -->
         <a href="index.html" class="btn btn-outline-light btn-sm text-nowrap">
              <i class="bi bi-person-plus"></i> início
            </a>

            <a href="register.html" class="btn btn-outline-light btn-sm text-nowrap">
              <i class="bi bi-person-plus"></i> Cadastro
            </a>
            <a href="login.html" class="btn btn-outline-light btn-sm text-nowrap">
              <i class="bi bi-box-arrow-in-right"></i> Login
            </a>
            <a href="cart.html" class="btn btn-action btn-sm text-nowrap position-relative">
              <i class="bi bi-cart3"></i> Carrinho
              <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-warning text-dark">
                0
              </span>
            </a>
          </div>
        </div>
      </div>
    </nav>
  </header>
