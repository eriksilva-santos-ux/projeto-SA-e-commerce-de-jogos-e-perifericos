<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vortex - Cadastro de Produtos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body {
      background-color: #0b0e14;
      color: #e1e1e6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .navbar {
      background-color: #121620 !important;
      border-bottom: 2px solid #ff0055;
    }
    .brand-logo {
      font-weight: 900;
      letter-spacing: 1px;
      color: #ff0055 !important;
    }
    .btn-action {
      background-color: #ff0055;
      color: #fff;
      border: none;
      font-weight: 600;
      transition: all 0.3s ease;
    }
    .btn-action:hover {
      background-color: #d90048;
      color: #fff;
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(255, 0, 85, 0.35);
    }
    .card-panel {
      background-color: #121620;
      border: 1px solid #2d3748;
      border-radius: 12px;
    }
    .card-panel .card-header,
    .card-panel .card-footer {
      background-color: rgba(255, 255, 255, 0.02);
      border-color: #2d3748;
    }
    .form-control, .form-select, .input-group-text {
      background-color: #0b0e14;
      border-color: #2d3748;
      color: #e1e1e6;
    }
    .form-control:focus, .form-select:focus {
      background-color: #0b0e14;
      border-color: #ff0055;
      color: #fff;
      box-shadow: 0 0 0 0.25rem rgba(255, 0, 85, 0.2);
    }
    .form-label {
      font-size: 0.875rem;
      font-weight: 500;
      color: #a0aec0;
    }
    .table-custom {
      --bs-table-bg: transparent;
      --bs-table-striped-bg: rgba(255, 255, 255, 0.02);
      --bs-table-hover-bg: rgba(255, 0, 85, 0.08);
      border-color: #2d3748;
    }
    .table-custom thead {
      background-color: #1a202c;
      color: #ff0055;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .product-thumb {
      width: 44px;
      height: 44px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid #2d3748;
    }
    footer {
      background-color: #121620;
      border-top: 1px solid #2d3748;
    }
  </style>
</head>
<body>

  <!-- HEADER / NAVBAR -->
  <header class="sticky-top">
    <nav class="navbar navbar-expand-lg navbar-dark py-3">
      <div class="container">
        <a href="index.html" class="navbar-brand d-flex align-items-center py-0">
          <img src="imagens/logo.png" alt="Vortex" style="height: 67px; width: auto; object-fit: contain;" onerror="this.style.display='none'">
          <span class="brand-logo fs-4"><i>VORTEX</i> <span class="badge bg-danger bg-opacity-10 text-danger border border-danger border-opacity-25 fs-6 ms-2 align-middle">ADMIN</span></span>
        </a>

        <div class="d-flex align-items-center gap-2 ms-auto">
          <span id="adminNomeBadge" class="text-secondary small d-none d-md-inline me-2"></span>
          <a href="index.html" class="btn btn-outline-light btn-sm text-nowrap">
            <i class="bi bi-house-door"></i> Loja
          </a>
          <button id="btnSairAdmin" type="button" class="btn btn-outline-danger btn-sm text-nowrap">
            <i class="bi bi-box-arrow-right"></i> Sair
          </button>
        </div>
      </div>
    </nav>
  </header>

  <main class="container py-5 flex-grow-1">
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 pb-2 border-bottom border-secondary-subtle">
      <div>
        <h2 class="fw-bold mb-1"><i class="bi bi-controller text-danger me-2"></i>Catálogo de Produtos</h2>
        <p class="text-secondary small mb-0">Adicione, edite e gerencie o estoque da Vortex.</p>
      </div>
      <div class="mt-3 mt-md-0">
        <button id="btnCarregarExemplos" type="button" class="btn btn-outline-secondary btn-sm">
          <i class="bi bi-magic me-1"></i> Carregar produtos de exemplo
        </button>
      </div>
    </div>

    <div id="resultado" class="alert d-none" role="alert"></div>

    <div class="row g-4">
      <!-- FORMULÁRIO DE CADASTRO -->
      <div class="col-12 col-lg-4">
        <div class="card card-panel shadow-lg">
          <div class="card-header py-3 d-flex justify-content-between align-items-center">
            <h5 id="tituloFormulario" class="card-title mb-0 fw-bold d-flex align-items-center gap-2">
              <i class="bi bi-plus-circle-fill" style="color: #ff0055;"></i> Novo Produto
            </h5>
            <span id="badgeEdicao" class="badge bg-warning text-dark d-none">Editando</span>
          </div>
          <div class="card-body p-4">
            <form id="formProduto">
              <input type="hidden" id="produtoId">

              <!-- Nome -->
              <div class="mb-3">
                <label for="nome" class="form-label">Nome do produto</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-tag"></i></span>
                  <input type="text" class="form-control" id="nome" placeholder="Ex: PlayStation 5 Pro" required>
                </div>
              </div>

              <!-- Marca / Desenvolvedora -->
              <div class="mb-3">
                <label for="marca" class="form-label">Marca / Desenvolvedora</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-building"></i></span>
                  <input type="text" class="form-control" id="marca" placeholder="Ex: Sony, Rockstar, Logitech...">
                </div>
              </div>

              <!-- Preço e Estoque -->
              <div class="row g-2 mb-3">
                <div class="col-7">
                  <label for="preco" class="form-label">Preço (R$)</label>
                  <div class="input-group">
                    <span class="input-group-text">R$</span>
                    <input type="number" class="form-control" id="preco" step="0.01" min="0.01" placeholder="0,00" required>
                  </div>
                </div>
                <div class="col-5">
                  <label for="estoque" class="form-label">Estoque</label>
                  <input type="number" class="form-control" id="estoque" min="0" placeholder="Qtd." value="1" required>
                </div>
              </div>

              <!-- Categoria e Selo -->
              <div class="row g-2 mb-3">
                <div class="col-6">
                  <label for="categoria" class="form-label">Categoria</label>
                  <select class="form-select" id="categoria">
                    <option value="Jogos">🎮 Jogos</option>
                    <option value="Periféricos">🎧 Periféricos</option>
                    <option value="Consoles">🕹️ Consoles</option>
                  </select>
                </div>
                <div class="col-6">
                  <label for="selo" class="form-label">Selo (Badge)</label>
                  <select class="form-select" id="selo">
                    <option value="Novidade">Novidade</option>
                    <option value="Promoção">Promoção</option>
                    <option value="Oferta Especial">Oferta Especial</option>
                    <option value="Em Estoque">Em Estoque</option>
                  </select>
                </div>
              </div>

              <!-- Opções (Plataforma ou Cor) -->
              <div class="mb-3">
                <label for="opcoes" class="form-label">Plataformas ou Cores <span class="text-secondary">(separadas por vírgula)</span></label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-sliders"></i></span>
                  <input type="text" class="form-control" id="opcoes" placeholder="Ex: PS5, Xbox Series X/S, PC">
                </div>
              </div>

              <!-- Imagem (URL) -->
              <div class="mb-3">
                <label for="imagem" class="form-label">URL da Imagem <span class="text-secondary">(opcional)</span></label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-image"></i></span>
                  <input type="url" class="form-control" id="imagem" placeholder="https://...">
                </div>
              </div>

              <!-- Descrição -->
              <div class="mb-4">
                <label for="descricao" class="form-label">Descrição do Produto</label>
                <textarea class="form-control" id="descricao" rows="3" placeholder="Texto exibido na página de detalhes..."></textarea>
              </div>

              <!-- Botões -->
              <div class="d-grid gap-2">
                <button type="submit" id="btnSalvar" class="btn btn-action py-2">
                  <i class="bi bi-check2-circle me-1"></i> Cadastrar Produto
                </button>
                <button type="button" id="btnCancelarEdicao" class="btn btn-outline-warning btn-sm d-none">
                  Cancelar edição
                </button>
                <button type="reset" id="btnLimpar" class="btn btn-outline-secondary btn-sm">
                  Limpar campos
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>

      <!-- TABELA DE PRODUTOS -->
      <div class="col-12 col-lg-8">
        <div class="card card-panel shadow-lg h-100">
          <div class="card-header py-3">
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-search"></i></span>
              <input type="search" class="form-control" id="busca" placeholder="Pesquisar por nome ou categoria...">
              <button class="btn btn-outline-secondary" id="btnTodos" type="button">Mostrar todos</button>
            </div>
          </div>

          <div class="table-responsive">
            <table class="table table-custom table-striped table-hover align-middle mb-0">
              <thead>
                <tr>
                  <th class="ps-3">#</th>
                  <th>Produto</th>
                  <th>Categoria</th>
                  <th class="text-center">Estoque</th>
                  <th class="text-end">Preço</th>
                  <th class="text-end pe-3">Ações</th>
                </tr>
              </thead>
              <tbody id="corpoTabela"></tbody>
            </table>
          </div>

          <div id="semResultado" class="text-center text-secondary py-5 my-auto">
            <i class="bi bi-inbox fs-1 d-block mb-2 opacity-50"></i>
            <p class="mb-0" id="textoSemResultado">Nenhum produto cadastrado ainda.</p>
          </div>

          <div class="card-footer d-flex justify-content-between align-items-center small text-secondary py-2 px-3 mt-auto">
            <span id="contador">0 produto(s)</span>
            <span>Vortex Admin</span>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="py-4 mt-auto">
    <div class="container">
      <div class="row align-items-center gy-3">
        <div class="col-md-6 text-center text-md-start">
          <a class="navbar-brand brand-logo fs-4" href="index.html"><i>VORTEX</i></a>
        </div>
        <div class="col-md-6 text-center text-md-end">
          <p class="text-secondary small mb-0">© 2026 Vortex. Todos os direitos reservados.</p>
        </div>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const adminSessao = JSON.parse(sessionStorage.getItem('adminLogado'));
    if (!adminSessao) {
      alert('Acesso restrito! Faça login como administrador.');
      window.location.href = 'acesso.html';
    } else {
      const adminNomeBadge = document.getElementById('adminNomeBadge');
      adminNomeBadge.innerHTML = `<i class="bi bi-person-badge text-danger me-1"></i>${adminSessao.nome}`;
    }

    document.getElementById('btnSairAdmin').addEventListener('click', () => {
      sessionStorage.removeItem('adminLogado');
      window.location.href = 'acesso.html';
    });

    const STORAGE_KEY = 'vortex_produtos';
    const IMAGEM_PADRAO = 'https://placehold.co/100x100/121620/ff0055?text=Vortex';

    const formProduto = document.getElementById('formProduto');
    const produtoIdInput = document.getElementById('produtoId');
    const nomeInput = document.getElementById('nome');
    const marcaInput = document.getElementById('marca');
    const precoInput = document.getElementById('preco');
    const estoqueInput = document.getElementById('estoque');
    const categoriaInput = document.getElementById('categoria');
    const seloInput = document.getElementById('selo');
    const opcoesInput = document.getElementById('opcoes');
    const imagemInput = document.getElementById('imagem');
    const descricaoInput = document.getElementById('descricao');

    const corpoTabela = document.getElementById('corpoTabela');
    const semResultado = document.getElementById('semResultado');
    const textoSemResultado = document.getElementById('textoSemResultado');
    const contador = document.getElementById('contador');
    const resultadoAlert = document.getElementById('resultado');

    const buscaInput = document.getElementById('busca');
    const btnTodos = document.getElementById('btnTodos');
    const btnSalvar = document.getElementById('btnSalvar');
    const btnCancelarEdicao = document.getElementById('btnCancelarEdicao');
    const tituloFormulario = document.getElementById('tituloFormulario');
    const badgeEdicao = document.getElementById('badgeEdicao');

    function obterProdutos() {
      return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    }

    function salvarProdutos(lista) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(lista));
    }

    function formatarMoeda(valor) {
      return Number(valor).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

    function mostrarMensagem(texto, tipo = 'success') {
      resultadoAlert.className = `alert alert-${tipo} alert-dismissible fade show`;
      resultadoAlert.innerHTML = `
        <i class="bi ${tipo === 'success' ? 'bi-check-circle-fill' : 'bi-info-circle-fill'} me-2"></i>
        ${texto}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
      `;
      setTimeout(() => {
        resultadoAlert.classList.add('d-none');
      }, 4000);
    }

    function renderizarTabela(filtro = '') {
      const produtos = obterProdutos();
      const termo = filtro.trim().toLowerCase();

      const filtrados = termo
        ? produtos.filter(p =>
            p.nome.toLowerCase().includes(termo) ||
            p.categoria.toLowerCase().includes(termo)
          )
        : produtos;

      corpoTabela.innerHTML = '';

      if (filtrados.length === 0) {
        semResultado.classList.remove('d-none');
        textoSemResultado.textContent = termo
          ? `Nenhum produto encontrado para "${filtro}".`
          : 'Nenhum produto cadastrado ainda.';
      } else {
        semResultado.classList.add('d-none');

        filtrados.forEach((produto, index) => {
          const badgeEstoque =
            produto.estoque > 5
              ? 'bg-success bg-opacity-10 text-success border-success'
              : produto.estoque > 0
              ? 'bg-warning bg-opacity-10 text-warning border-warning'
              : 'bg-danger bg-opacity-10 text-danger border-danger';

          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td class="ps-3 text-secondary fw-semibold">${index + 1}</td>
            <td>
              <div class="d-flex align-items-center gap-2">
                <img src="${produto.imagem || IMAGEM_PADRAO}" alt="${produto.nome}" class="product-thumb" onerror="this.src='${IMAGEM_PADRAO}'">
                <div>
                  <span class="fw-semibold text-white d-block">${produto.nome}</span>
                  <small class="text-secondary">${produto.marca || 'Vortex'}</small>
                </div>
              </div>
            </td>
            <td><span class="badge bg-dark border border-secondary">${produto.categoria}</span></td>
            <td class="text-center">
              <span class="badge border border-opacity-25 ${badgeEstoque}">
                ${produto.estoque} un.
              </span>
            </td>
            <td class="text-end fw-bold text-success">${formatarMoeda(produto.preco)}</td>
            <td class="text-end pe-3 text-nowrap">
              <a href="detalhe-produto.html?id=${produto.id}" class="btn btn-outline-light btn-sm me-1" title="Ver Detalhes">
                <i class="bi bi-eye"></i>
              </a>
              <button type="button" class="btn btn-outline-info btn-sm me-1" title="Editar" onclick="editarProduto(${produto.id})">
                <i class="bi bi-pencil"></i>
              </button>
              <button type="button" class="btn btn-outline-danger btn-sm" title="Excluir" onclick="excluirProduto(${produto.id})">
                <i class="bi bi-trash"></i>
              </button>
            </td>
          `;
          corpoTabela.appendChild(tr);
        });
      }

      contador.textContent = `${filtrados.length} produto(s) exibido(s) de ${produtos.length}`;
    }

    formProduto.addEventListener('submit', function (e) {
      e.preventDefault();

      const idEditando = produtoIdInput.value;
      const nome = nomeInput.value.trim();
      const marca = marcaInput.value.trim() || 'Vortex';
      const preco = parseFloat(precoInput.value);
      const estoque = parseInt(estoqueInput.value, 10) || 0;
      const categoria = categoriaInput.value;
      const selo = seloInput.value;
      const opcoes = opcoesInput.value.trim();
      const imagem = imagemInput.value.trim();
      const descricao = descricaoInput.value.trim() || 'Produto oficial Vortex com garantia, alto desempenho e envio rápido para todo o Brasil.';

      if (!nome || isNaN(preco) || preco <= 0) {
        mostrarMensagem('Preencha o nome e um preço válido maior que zero.', 'danger');
        return;
      }

      const produtos = obterProdutos();

      if (idEditando) {
        const index = produtos.findIndex(p => p.id === Number(idEditando));
        if (index !== -1) {
          produtos[index] = {
            ...produtos[index],
            nome,
            marca,
            preco,
            estoque,
            categoria,
            selo,
            opcoes,
            imagem,
            descricao
          };
          salvarProdutos(produtos);
          mostrarMensagem(`Produto "${nome}" atualizado com sucesso!`, 'info');
        }
        sairModoEdicao();
      } else {
        const novoProduto = {
          id: Date.now(),
          nome,
          marca,
          preco,
          estoque,
          categoria,
          selo,
          opcoes,
          imagem,
          descricao
        };
        produtos.push(novoProduto);
        salvarProdutos(produtos);
        formProduto.reset();
        estoqueInput.value = 1;
        mostrarMensagem(`Produto "${nome}" cadastrado com sucesso!`, 'success');
      }

      renderizarTabela(buscaInput.value);
    });

    window.editarProduto = function (id) {
      const produtos = obterProdutos();
      const produto = produtos.find(p => p.id === id);
      if (!produto) return;

      produtoIdInput.value = produto.id;
      nomeInput.value = produto.nome;
      marcaInput.value = produto.marca || '';
      precoInput.value = produto.preco;
      estoqueInput.value = produto.estoque;
      categoriaInput.value = produto.categoria;
      seloInput.value = produto.selo || 'Novidade';
      opcoesInput.value = produto.opcoes || '';
      imagemInput.value = produto.imagem || '';
      descricaoInput.value = produto.descricao || '';

      tituloFormulario.innerHTML = `<i class="bi bi-pencil-square text-warning"></i> Editar Produto`;
      badgeEdicao.classList.remove('d-none');
      btnSalvar.innerHTML = `<i class="bi bi-save me-1"></i> Salvar Alterações`;
      btnCancelarEdicao.classList.remove('d-none');
      nomeInput.focus();
    };

    function sairModoEdicao() {
      produtoIdInput.value = '';
      formProduto.reset();
      estoqueInput.value = 1;
      tituloFormulario.innerHTML = `<i class="bi bi-plus-circle-fill" style="color: #ff0055;"></i> Novo Produto`;
      badgeEdicao.classList.add('d-none');
      btnSalvar.innerHTML = `<i class="bi bi-check2-circle me-1"></i> Cadastrar Produto`;
      btnCancelarEdicao.classList.add('d-none');
    }

    btnCancelarEdicao.addEventListener('click', sairModoEdicao);

    window.excluirProduto = function (id) {
      const produtos = obterProdutos();
      const produto = produtos.find(p => p.id === id);
      if (!produto) return;

      if (confirm(`Deseja realmente excluir "${produto.nome}" do catálogo?`)) {
        const atualizados = produtos.filter(p => p.id !== id);
        salvarProdutos(atualizados);
        if (Number(produtoIdInput.value) === id) sairModoEdicao();
        renderizarTabela(buscaInput.value);
        mostrarMensagem(`Produto "${produto.nome}" removido.`, 'warning');
      }
    };

    buscaInput.addEventListener('input', () => renderizarTabela(buscaInput.value));

    btnTodos.addEventListener('click', () => {
      buscaInput.value = '';
      renderizarTabela();
    });

    document.getElementById('btnCarregarExemplos').addEventListener('click', () => {
      const atuais = obterProdutos();
      if (atuais.length > 0 && !confirm('Isso adicionará 3 produtos de exemplo à lista atual. Continuar?')) {
        return;
      }
      const exemplos = [
        {
          id: Date.now() + 1,
          nome: 'Grand Theft Auto VI',
          marca: 'Rockstar Games',
          preco: 349.90,
          estoque: 15,
          categoria: 'Jogos',
          selo: 'Novidade',
          opcoes: 'PS5, Xbox Series X/S, PC',
          imagem: 'imagens/GTA_VI_cover.jpg',
          descricao: 'Grand Theft Auto VI leva você para o estado de Leonida, lar das ruas em neon de Vice City, na maior e mais imersiva evolução da franquia até hoje.'
        },
        {
          id: Date.now() + 2,
          nome: 'PlayStation 5 Pro SSD 2TB',
          marca: 'Sony',
          preco: 7390.00,
          estoque: 4,
          categoria: 'Consoles',
          selo: 'Em Estoque',
          opcoes: 'Branco',
          imagem: 'https://images.kabum.com.br/produtos/fotos/636960/console-playstation-5-pro-sony-ssd-2tb-controle-sem-fio-dualsense-branco-1000046552_1727095996_g.jpg',
          descricao: 'O PlayStation 5 Pro entrega gráficos ultrarrealistas com Ray Tracing avançado, resolução 4K nítida com PSSR e armazenamento SSD ultrarrápido de 2TB.'
        },
        {
          id: Date.now() + 3,
          nome: 'Teclado Gamer Mecânico Wooting 60HE+',
          marca: 'Wooting',
          preco: 1826.00,
          estoque: 8,
          categoria: 'Periféricos',
          selo: 'Promoção',
          opcoes: 'Preto',
          imagem: 'https://http2.mlstatic.com/D_Q_NP_2X_660385-MLB117250273565_092026-P.webp',
          descricao: 'Teclado analógico magnético 60% com Rapid Trigger ajustável de 0.1mm, switches Lekker e tempo de resposta competitivo.'
        }
      ];
      salvarProdutos([...atuais, ...exemplos]);
      renderizarTabela();
      mostrarMensagem('Produtos de exemplo carregados!', 'success');
    });

    renderizarTabela();
  </script>
</body>
</html>
