<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vortex - Entrar na Conta</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    :root {
      --bg-main: #0b0e14;
      --bg-surface: #121620;
      --bg-input: #181d2a;
      --accent-pink: #ff0055;
      --accent-pink-hover: #d90048;
      --border-subtle: #2d3748;
      --text-main: #e1e1e6;
      --text-muted: #94a3b8;
    }
    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .navbar {
      background-color: #121620 !important;
      border-bottom: 2px solid #ff0055;
    }
    .brand-logo {
      font-weight: 900;
      letter-spacing: 1px;
      color: #ff0055 !important;
    }
    .btn-action {
      background-color: #ff0055;
      color: #fff;
      border: none;
      font-weight: 600;
      transition: all 0.3s ease;
    }
    .btn-action:hover {
      background-color: #d90048;
      color: #fff;
      transform: translateY(-2px);
    }
    .auth-card {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    .input-group-text-custom {
      background-color: var(--bg-input);
      border: 1px solid var(--border-subtle);
      border-right: none;
      color: var(--text-muted);
    }
    .form-control-custom {
      background-color: var(--bg-input);
      border: 1px solid var(--border-subtle);
      color: #fff;
    }
    .form-control-custom::placeholder { color: #64748b; }
    .form-control-custom:focus {
      background-color: var(--bg-input);
      color: #fff;
      border-color: var(--accent-pink);
      box-shadow: 0 0 0 0.2rem rgba(255, 0, 85, 0.2);
    }
    .input-group:focus-within .input-group-text-custom {
      border-color: var(--accent-pink);
      color: var(--accent-pink);
    }
    .form-check-input:checked {
      background-color: var(--accent-pink);
      border-color: var(--accent-pink);
    }
    .link-accent {
      color: var(--accent-pink);
      text-decoration: none;
    }
    .link-accent:hover {
      color: var(--accent-pink-hover);
      text-decoration: underline;
    }
    footer {
      background-color: var(--bg-surface);
      border-top: 1px solid var(--border-subtle);
    }
  </style>
</head>
<body>

  <!-- HEADER / NAVBAR -->
  <header class="sticky-top">
    <nav class="navbar navbar-expand-lg navbar-dark py-3">
      <div class="container">
        <a href="index.html" class="navbar-brand d-flex align-items-center py-0">
          <img src="imagens/logo.png" alt="Vortex" style="height: 67px; width: auto; object-fit: contain;">
          <span class="brand-logo fs-4"><i>VORTEX</i></span>
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse mt-3 mt-lg-0" id="navbarContent">
          <div id="navUserActions" class="d-flex align-items-center gap-2 mt-2 mt-lg-0 ms-auto">
            <a href="index.html" class="btn btn-outline-light btn-sm text-nowrap">
              <i class="bi bi-house-door"></i> Início
            </a>
            <a href="register.html" class="btn btn-outline-light btn-sm text-nowrap">
              <i class="bi bi-person-plus"></i> Cadastro
            </a>
            <a href="acesso.html" class="btn btn-outline-light btn-sm text-nowrap">
              <i class="bi bi-person-lock"></i> Acesso Restrito
            </a>
            <a href="login.html" class="btn btn-outline-light active btn-sm text-nowrap">
              <i class="bi bi-box-arrow-in-right"></i> Login
            </a>
            <a href="cart.html" class="btn btn-action btn-sm text-nowrap position-relative">
              <i class="bi bi-cart3"></i> Carrinho
              <span id="cart-badge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-warning text-dark">0</span>
            </a>
          </div>
        </div>
      </div>
    </nav>
  </header>

  <!-- CONTEÚDO PRINCIPAL -->
  <main class="container my-5 flex-grow-1 d-flex align-items-center justify-content-center">
    <div class="row w-100 justify-content-center">
      <div class="col-12 col-md-8 col-lg-5">
        <div class="card auth-card p-3 p-sm-4">
          <div class="card-body">
            <h3 class="fw-bold text-white text-center mb-1">Acesse sua conta</h3>
            <p class="text-secondary text-center small mb-4">Entre para gerenciar seus pedidos e salvar favoritos.</p>

            <form id="loginForm" action="#" method="POST">
              <!-- E-mail -->
              <div class="mb-3">
                <label for="email" class="form-label text-secondary small fw-semibold">E-mail</label>
                <div class="input-group">
                  <span class="input-group-text input-group-text-custom"><i class="bi bi-envelope"></i></span>
                  <input type="email" class="form-control form-control-custom" id="email" placeholder="seu@email.com" required>
                </div>
              </div>

              <!-- Senha -->
              <div class="mb-3">
                <div class="d-flex justify-content-between align-items-center mb-1">
                  <label for="password" class="form-label text-secondary small fw-semibold mb-0">Senha</label>
                  <a href="#" class="small link-accent">Esqueceu a senha?</a>
                </div>
                <div class="input-group">
                  <span class="input-group-text input-group-text-custom"><i class="bi bi-lock"></i></span>
                  <input type="password" class="form-control form-control-custom" id="password" placeholder="••••••••" required>
                </div>
              </div>

              <!-- Lembrar de mim -->
              <div class="form-check mb-4">
                <input class="form-check-input bg-dark border-secondary" type="checkbox" id="rememberMe">
                <label class="form-check-label text-secondary small" for="rememberMe">
                  Lembrar dos meus dados neste dispositivo
                </label>
              </div>

              <!-- Botão Entrar -->
              <button type="submit" class="btn btn-action w-100 py-2">
                <i class="bi bi-box-arrow-in-right me-2"></i> Entrar
              </button>
            </form>

            <hr class="border-secondary my-4">

            <p class="text-center text-secondary small mb-0">
              Ainda não tem uma conta? <a href="register.html" class="link-accent fw-semibold">Cadastre-se</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="py-4 mt-auto">
    <div class="container text-center">
      <p class="text-secondary small mb-0">
        © 2026 Vortex. Todos os direitos reservados. Termos de Direitos Autorais.
      </p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="login.js"></script>
</body>
</html>
